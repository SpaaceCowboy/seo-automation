# This include is restricted to content-admin routes and assets by the parent proxy.
client_max_body_size 1m;
limit_req zone=roco_requests burst=30 nodelay;
proxy_pass $roco_content;
proxy_set_header Host rocobroker.com;
proxy_set_header X-Forwarded-Host scc.rocobroker.com;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Roco-Client-IP $remote_addr;
include /etc/nginx/staff-proxy-header.conf;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_redirect https://rocobroker.com/admin https://scc.rocobroker.com/admin;
proxy_buffering off;
