# Loopback-only production proxy for SSH tunnel access or a host TLS proxy.
# Fastify stays private; every /api request goes through Next's BFF.
limit_req_zone $binary_remote_addr zone=roco_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=roco_requests:10m rate=10r/s;
log_format roco_safe '{"requestId":"$request_id","method":"$request_method","status":$status,"latency":$request_time}';
server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $roco_dashboard http://dashboard:3000;
    client_max_body_size 64k;
    access_log /dev/stdout roco_safe;
    error_log /dev/stderr crit;
    server_tokens off;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req_status 429;

    location = /api/session {
        limit_req zone=roco_login burst=5 nodelay;
        proxy_pass $roco_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=roco_requests burst=30 nodelay;
        proxy_pass $roco_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
