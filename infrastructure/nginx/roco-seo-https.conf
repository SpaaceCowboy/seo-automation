# Only the authenticated Next dashboard/BFF is exposed. Fastify and PostgreSQL stay private.
limit_req_zone $binary_remote_addr zone=roco_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=roco_requests:10m rate=10r/s;
log_format roco_safe '{"requestId":"$request_id","method":"$request_method","status":$status,"latency":$request_time}';
server {
    listen 80 default_server;
    server_name _;
    access_log /dev/stdout roco_safe;
    error_log /dev/stderr crit;
    server_tokens off;
    location / { return 444; }
}
server {
    listen 80;
    server_name scc.rocobroker.com;
    access_log /dev/stdout roco_safe;
    error_log /dev/stderr crit;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://scc.rocobroker.com$request_uri; }
}
# Preserve a loopback health/tunnel endpoint, with a redirect to the canonical HTTPS origin.
server {
    listen 8080;
    server_name _;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $roco_dashboard http://dashboard:3000;
    location = /sign-in {
        proxy_pass $roco_dashboard;
        proxy_set_header Host scc.rocobroker.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
    }
    location / { return 308 https://scc.rocobroker.com$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name scc.rocobroker.com;
    if ($host != scc.rocobroker.com) { return 444; }
    ssl_certificate /etc/letsencrypt/live/scc.rocobroker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scc.rocobroker.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:roco_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Scoped to this hostname; no includeSubDomains/preload policy is applied to the brokerage.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $roco_dashboard http://dashboard:3000;
    client_max_body_size 64k;
    access_log /dev/stdout roco_safe;
    error_log /dev/stderr crit;
    server_tokens off;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req_status 429;
    location = /api/session {
        limit_req zone=roco_login burst=5 nodelay;
        proxy_pass $roco_dashboard;
        proxy_set_header Host scc.rocobroker.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }
    location / {
        limit_req zone=roco_requests burst=30 nodelay;
        proxy_pass $roco_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host scc.rocobroker.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
